<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Confucius Institute Islamabad at NUML">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00281c"/><stop offset=".55" stop-color="#006c4b"/><stop offset="1" stop-color="#00895c"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#05d590" stop-opacity=".55"/><stop offset="1" stop-color="#05d590" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    text{font-family:'Plus Jakarta Sans','Segoe UI',Helvetica,Arial,'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;fill:#fff}
    .rise{animation:rise .9s ease-out both}.d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}.d4{animation-delay:.75s}
    .orb{animation:drift 11s ease-in-out infinite alternate}.orb2{animation:drift 15s ease-in-out infinite alternate-reverse}
    .ring{transform-origin:1000px 170px;animation:spin 40s linear infinite}
    .dot{animation:pulse 2s ease-in-out infinite}
    @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    @keyframes drift{from{transform:translate(0,0)}to{transform:translate(70px,-30px)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{50%{opacity:.25}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <clipPath id="card"><rect width="1200" height="340" rx="24"/></clipPath>
  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <circle class="orb" cx="880" cy="60" r="220" fill="url(#glow)"/>
    <circle class="orb2" cx="140" cy="330" r="200" fill="url(#glow)"/>
    <g fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="1.5">
      <g class="ring"><circle cx="1000" cy="170" r="128" stroke-dasharray="3 9"/></g>
      <circle cx="1000" cy="170" r="100"/><ellipse cx="1000" cy="170" rx="52" ry="100"/><path d="M900 170h200M1000 70v200M914 120h172M914 220h172"/>
    </g>
    <text x="1000" y="190" text-anchor="middle" font-size="58" font-weight="700" fill-opacity=".92">孔子学院</text>
    <g class="rise"><rect x="64" y="52" width="268" height="34" rx="17" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".28"/><circle class="dot" cx="86" cy="69" r="5" fill="#05d590"/><text x="102" y="74" font-size="14" font-weight="700" letter-spacing="1.5">NUML · ISLAMABAD</text></g>
    <text class="rise d1" x="62" y="152" font-size="54" font-weight="800">Confucius Institute</text>
    <text class="rise d2" x="62" y="214" font-size="54" font-weight="800" style="fill:#7ff0c4">Islamabad</text>
    <text class="rise d3" x="64" y="256" font-size="20" fill-opacity=".9">Chinese language, culture and Pakistan–China friendship since 2005</text>
    <text class="rise d4" x="64" y="298" font-size="20" letter-spacing="4" style="fill:#c8f7e3">语言 · 文化 · 交流 · 理解</text>
  </g>
</svg>
